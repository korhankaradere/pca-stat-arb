[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pca-stat-arb"
version = "0.1.0"
description = "PCA-based statistical arbitrage on US equities (Avellaneda & Lee, 2010)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "lxml>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyterlab>=4", "ipykernel"]
crsp = ["wrds>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
